[package]
name = "harmonizer-plugin"
description = "VST3 wrapper and editor for the harmonizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
harmonizer-dsp.workspace = true
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
nice-plug-egui = "0.6.0"
egui = { version = "0.37.0", features = ["default_fonts"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
